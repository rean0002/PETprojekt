<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start side</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loginStyle.css" >
</head>
<body>

<div class="app-container">
    <main>
<div class="backgroundbox"><!-- background -->



<div><!-- headline & subtext -->

    <h1>Velkommen tilbage</h1>
    <h3 class="ancizar">Log ind og se dagens opggaver</h3>
</div>

<div><!-- log in section -->

    <form action="/login" method="POST" class="login-container">
        <div class="input_container">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="mail@mail.com" required>
        </div>
        <div class="input_container">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="*****" required>
        </div>
        <div >
            <a href="">Glemt adgangskode?</a>
        </div>

        <button class="btn organge" type="submit">Log ind</button>
    </form>

</div>

<div class="grid-box"><!-- divider -->

    <svg width="100" height="10">
        <line x1="100" stroke="black" stroke-width="1"/>
    </svg>
    <p>Eller</p>
    <svg width="100" height="10">
        <line x1="100" stroke="black" stroke-width="1"/>
    </svg>
</div>

<div><!-- fortæt med google-->
<button class="btn white">Fortæt med google</button>
</div>

<div class="ny_container"><!-- ny bruger-->
    <p>Ny bruger? <a href="">Opret konto</a> </p> <!-- link -->
</div>

</div>
    </main>
</div>

</body>

<script src="js/login.js"></script>
</html>
