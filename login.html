<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start side</title>
    <link rel="stylesheet" href="loginStyle.css">
    <link rel="stylesheet" href="color.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="backgroundbox"><!-- background -->



<div><!-- headline & subtext -->

    <h1>Velkommen tilbage</h1>
    <p class="ancizar">Log ind og se dagens opggaver</p>
</div>

<div><!-- log in section -->

    <form action="">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="mail@mail.com">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="*****">
        </div>
        <div>
            <a href="">Glemt adgangskode?</a>
        </div>
            <button type="submit">Log ind</button>

    </form>
</div>

<div class="grid-box"><!-- divider -->

    <svg width="100" height="10">
        <line x1="100" stroke="black" stroke-width="1"/>
    </svg>
    <p>Eller</p>
    <svg width="100" height="10">
        <line x1="100" stroke="black" stroke-width="1"/>
    </svg>
</div>

<div><!-- fortæt med google-->
<button>Fortæt med google</button>
</div>

<div><!-- ny bruger-->
    <p>Ny bruger? <a href="">Opret konto</a> </p> <!-- link -->
</div>

</div>
</body>
</html>
