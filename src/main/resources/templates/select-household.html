<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select household</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toggle.css">
    <link rel="stylesheet" href="css/dashboardStyle.css">
    <link rel="stylesheet" href="css/selectHouseholdStyle.css">
   <!-- <script src="js/dashboard.js" defer></script> -->
</head>
<body>
<div class="app-container">
    <main>

        <div id="profilBtn" class="btn_circle">
            <a href="#"><img src="svg/profile-icon.svg" alt="Profil"></a>
        </div>

        <!-- header -->
        <div class="header_card">
            <div class="header">
                <h1>Velkommen</h1>
                <h2 th:text="${firstName}">Fornavn</h2>
                <div id="dato-box">
                    <p>Vælg husstand</p>
                </div>
            </div>
        </div>


        <!-- households -->
        <div class="section">
            <div class="houseHoldFlex">
                <a class="household" th:each="household : ${households}" th:href="@{/households/{id}/selected(id=${household.id})}">
                    <img  style="grid-area: box-1" src="svg/select-household.svg">
                    <p class="householdName"  th:text="${household.name}" style="grid-area: box-2">household name</p>
                    <p class="householdCode"  th:text="${household.code}" style="grid-area: box-3">household code</p>
                    <a/>
            </div>
        </div>

    </main>
</div>


</body>
</html>
