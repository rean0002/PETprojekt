<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Opret opgave</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/toggle.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/opret-opgave.css">
</head>
<body>
<div class="app-container">

    <main>
        <div class="backgroundbox">
            <div id="header-row">
                <a href="/dashboard">
                    <button id="btn-tilbage" aria-label="Tilbage">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 12H4M4 12L10 6M4 12L10 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </a>
                <h2>Opret opgave</h2>
            </div>

            <form id="opgave-form" action="/opret-opgave" method="post">

                <div id="field-titel" class="field input">
                    <label for="titel">Titel</label>
                    <input type="text" id="titel" name="titel" placeholder="Fx Støvsug stuen" required>
                </div>

                <div id="field-beskrivelse" class="field input">
                    <label for="beskrivelse">Beskrivelse (valgfri)</label>
                    <input type="text" id="beskrivelse" name="beskrivelse" placeholder="Tilføj en note...">
                </div>

                <div id="kategori-group" class="field input">
                    <label>Kategori</label>
                    <div class="pille-row">
                        <button type="button" class="category" data-kategori="CLEANING">Rengøring</button>
                        <button type="button" class="category" data-kategori="TRASH">Affald</button>
                        <button type="button" class="category" data-kategori="FOOD">Køkken</button>
                    </div>

                    <input type="hidden" id="taskCategory" name="taskCategory">

                </div>

                <div class="to-felter-raekke">
                    <div id="field-dato" class="field">
                        <label for="dato">Dato</label>
                        <input type="date" id="dato" name="dato">
                    </div>
                    <div id="field-tidspunkt" class="field">
                        <label for="tidspunkt">Tidspunkt</label>
                        <input type="time" id="tidspunkt" name="tidspunkt">
                    </div>
                </div>

                <div id="field-gentages" class="field input">
                    <label for="gentages">Gentages</label>
                    <select id="gentages" name="gentages">
                        <option value="NONE">Gentages ikke</option>
                        <option value="DAILY">Dagligt</option>
                        <option value="WEEKLY" selected>Ugentligt</option>
                        <option value="MONTHLY">Månedligt</option>
                    </select>
                </div>

                <div id="field-ansvarlig" class="field input">
                    <label for="ansvarlig">Ansvarlig</label>
                    <select id="ansvarlig" name="ansvarlig">
                        <option value="Rebecca">Rebecca</option>
                        <option value="Olga">Olga</option>
                        <option value="Alexander">Alexander</option>
                    </select>
                </div>

                <div id="toggle-arves" class="field">
                    <div>
                        <p>Skal opgaven arves</p>
                        <p>Gives videre hvis den ikke udføres</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="vidergives" name="vidergives">
                        <span class="slider"></span>
                    </label>
                </div>

                <button class="btn organge" type="submit">Gem opgave</button>

            </form>
        </div>
    </main>

    <footer id="footer">
    </footer>
</div>
<script>
    document.querySelectorAll(".category").forEach(btn => {
        btn.addEventListener("click", () => {
            document.getElementById("taskCategory").value = btn.dataset.kategori;
        });
    });
</script>

</body>
</html>
