<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select household</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toggle.css">
    <link rel="stylesheet" href="css/dashboardStyle.css">
    <script src="js/dashboard.js" defer></script>
</head>
<body>
<div class="app-container">
    <main>

        <div id="profilBtn" class="btn_circle">
            <a href="#"><img src="svg/profile-icon.svg" alt="Profil"></a>
        </div>

        <!-- header -->
        <div class="header_card">
            <div class="header">
                <h1>Velkommen</h1>
                <h2 th:text="${firstName}">Fornavn</h2>
                <div id="dato-box">
                    <p>Vælg husstand</p>
                </div>
            </div>
        </div>


        <!-- households -->
        <div class="section">
            <div class="houseHoldFlex">
                <div class="household" th:each="household : ${households}" >
                    <img  style="grid-area: box-1" src="svg/select-household.svg">
                    <p class="householdName"  th:text="${household.name}" style="grid-area: box-2">household name</p>
                    <p class="householdCode"  th:text="${household.code}" style="grid-area: box-3">household code</p>
                </div>


            </div>


        </div>

    </main>


    <footer> <!-- footer menu
        <a href="dashboard.html" class="nav-item active">
            <img src="svg/nav1.svg" alt="">
            <span>Hjem</span>
        </a>
        <a href="husstand.html" class="nav-item">
            <img src="svg/nav2.svg" alt="">
            <span>Husstand</span>
        </a>
        <a href="point.html" class="nav-item">
            <img src="svg/nav3.svg" alt="">
            <span>Point</span>
        </a>
        <a href="reminders.html" class="nav-item">
            <img src="svg/nav4.svg" alt="">
            <span>Reminders</span>
        </a>-->
    </footer>
</div>
</body>
</html>
